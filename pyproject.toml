[tool.poetry]
name = "reflex-ddns-livekit-audio-chat"
version = "0.1.0"
description = "Reflex audio rooms on a self-hosted (embedded) open-source LiveKit server, for *.reflex-ddns.com"
authors = ["Milo Chen"]
license = "MIT"
readme = "README.md"
packages = [{include = "reflex_ddns_livekit_audio_chat"}]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.16 cap: verified up to 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
livekit-api = "^1.0"
aiohttp = "^3.9"
httpx = "*"
python-dotenv = "^1.2.1"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}

[tool.poetry.group.dev.dependencies]
playwright = "^1.42.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
